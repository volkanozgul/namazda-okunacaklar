<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Namaz Sûreleri</title>
<style>
:root{--bg:#f6f3ea;--card:#fffdf7;--ink:#1d2a25;--mut:#66736d;--acc:#14604a;--acc2:#e6efe9;--line:#ddd6c4;--done:#c9a24a}
[data-t=dark]{--bg:#0e1714;--card:#16231f;--ink:#e8efe9;--mut:#8fa39a;--acc:#6fcf9f;--acc2:#1e332c;--line:#2a3d36;--done:#d9b45a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif",serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
h1{font-size:22px;margin:0}
.ib{background:var(--acc2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;margin-left:6px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;font:600 17px Georgia,serif;padding:12px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-t=dark] nav button.on{color:#0e1714}
main{padding:6px 16px 40px;max-width:640px;margin:auto}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:6px 14px 10px}
.sec h2{font-size:19px;margin:10px 0 4px;display:flex;justify-content:space-between}
.sec h2 small{color:var(--mut);font-weight:400;font-size:15px}
.rk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.chk{flex:0 0 44px;height:44px;border-radius:50%;border:2px solid var(--acc);background:none;color:var(--ink);font:700 18px Georgia,serif}
.rk.d .chk{background:var(--done);border-color:var(--done);color:#1d2a25}
.sr{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:2px 0}
.sr b{display:block;font-size:24px}
.sr span{display:block;color:var(--mut);font-size:17px;margin-top:2px;line-height:1.35}
.rk.d .sr{opacity:.55}
.rst{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font:16px Georgia,serif;text-decoration:underline;padding:10px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#sh.o{display:flex;align-items:flex-end}
#pn{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){#pn{animation:none}}
#pn h3{font-size:26px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.ay{font-size:23px;line-height:1.5;padding:10px 0;border-top:1px solid var(--line)}
.ay i{font-style:normal;color:var(--acc);font-size:16px;margin-right:8px;font-weight:700}
</style>
</head>
<body>
<header><h1>Namaz Sûreleri</h1><div><button class="ib" id="fz">A+</button><button class="ib" id="th">🌙</button></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="sh"><div id="pn"></div></div>
<script>
var S={F:["Fâtiha","Bismillâhirrahmânirrahîm. Elhamdü lillâhi rabbil âlemîn. Errahmânirrahîm. Mâliki yevmiddîn. İyyâke na'büdü ve iyyâke nestaîn. İhdinas sırâtal müstakîm. Sırâtallezîne en'amte aleyhim ğayril mağdûbi aleyhim veleddâllîn. Âmîn."],
KF:["Kâfirûn","Kul yâ eyyühel kâfirûn. Lâ a'büdü mâ ta'büdûn. Ve lâ entüm âbidûne mâ a'büd. Ve lâ ene âbidün mâ abedtüm. Ve lâ entüm âbidûne mâ a'büd. Leküm dînüküm ve liye dîn."],
NS:["Nasr","İzâ câe nasrullâhi vel feth. Ve raeyten nâse yedhulûne fî dînillâhi efvâcâ. Fesebbih bihamdi rabbike vestağfirh, innehû kâne tevvâbâ."],
DH:["Duhâ","Ved duhâ. Vel leyli izâ secâ. Mâ vedde'ake rabbüke ve mâ kalâ. Ve lel âhiratü hayrun leke minel ûlâ. Ve le sevfe yu'tîke rabbüke fetardâ. Elem yecidke yetîmen feâvâ. Ve vecedeke dâllen fehedâ. Ve vecedeke â'ilen feağnâ. Fe emmel yetîme felâ takher. Ve emmes sâile felâ tenher. Ve emmâ bi ni'meti rabbike fehaddis."],
IN:["İnşirâh","Elem nışrah leke sadrak. Ve vada'nâ anke vizrak. Ellezî enkada zahrak. Ve rafa'nâ leke zikrak. Fe inne meal usri yüsrâ. İnne meal usri yüsrâ. Fe izâ ferağte fensab. Ve ilâ rabbike ferğab."],
TN:["Tîn","Vet tîni vez zeytûn. Ve tûri sînîn. Ve hâzel beledil emîn. Le kad halaknel insâne fî ahseni takvîm. Sümme radednâhü esfele sâfilîn. İllellezîne âmenû ve amilüs sâlihâti fe lehüm ecrun ğayru memnûn. Fe mâ yükezzibüke ba'dü bid dîn. Eleysellâhü bi ahkemil hâkimîn."],
KD:["Kadr","İnnâ enzelnâhü fî leyletil kadr. Ve mâ edrâke mâ leyletül kadr. Leyletül kadri hayrun min elfi şehr. Tenezzelül melâiketü ver rûhu fîhâ bi izni rabbihim min kulli emr. Selâmün hiye hattâ matlaıl fecr."],
TK:["Tekâsür","Elhâkümüt tekâsür. Hattâ zürtümül mekâbir. Kellâ sevfe ta'lemûn. Sümme kellâ sevfe ta'lemûn. Kellâ lev ta'lemûne ilmel yakîn. Le terevünnel cahîm. Sümme le terevünnehâ aynel yakîn. Sümme le tüs'elünne yevmeizin anin naîm."],
AS:["Asr","Vel asr. İnnel insâne le fî husr. İllellezîne âmenû ve amilüs sâlihâti ve tevâsav bil hakkı ve tevâsav bis sabr."],
FL:["Fîl","Elem tera keyfe fe'ale rabbüke bi ashâbil fîl. Elem yec'al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bihicâratin min siccîl. Fece'alehüm ke'asfin me'kûl."],
KR:["Kureyş","Li îlâfi kureyş. Îlâfihim rıhleteş şitâi ves sayf. Fel ya'büdû rabbe hâzel beyt. Ellezî et'amehüm min cû'in ve âmenehüm min havf."],
MN:["Mâûn","Era'eytellezî yükezzibü biddîn. Fezâlikellezî yedü'ul yetîm. Ve lâ yehuddu alâ taâmil miskîn. Feveylün lil musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemneûnel mâûn."],
KV:["Kevser","İnnâ a'taynâkel kevser. Fesalli li rabbike venhar. İnne şânieke hüvel ebter."],
TB:["Tebbet","Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Seyaslâ nâran zâte leheb. Vemraetühû hammâletel hatab. Fî cîdihâ hablün min mesed."],
IH:["İhlâs","Kul hüvallâhü ehad. Allâhüssamed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad."],
FK:["Felak","Kul e'ûzü bi rabbil felak. Min şerri mâ halak. Ve min şerri ğâsikın izâ vekab. Ve min şerrin neffâsâti fil ukad. Ve min şerri hâsidin izâ hased."],
NA:["Nâs","Kul e'ûzü bi rabbin nâs. Melikin nâs. İlâhin nâs. Min şerril vesvâsil hannâs. Ellezî yüvesvisü fî sudûrin nâs. Minel cinneti ven nâs."]};
var P=[
["Sabah",[["Sünnet",["KF","NS"]],["Farz",["DH","IN"]]]],
["Öğle",[["İlk sünnet",["TN","KD","TK","AS"]],["Farz",["FL","KR","F","F"]],["Son sünnet",["MN","KV"]]]],
["İkindi",[["Sünnet",["KF","NS","TB","IH"]],["Farz",["FK","NA","F","F"]]]],
["Akşam",[["Farz",["KR","MN","F"]],["Sünnet",["KV","KF"]]]],
["Yatsı",[["İlk sünnet",["TK","AS","FL","KR"]],["Farz",["MN","KV","F","F"]],["Son sünnet",["KF","NS"]],["Vitir",["TB","IH","FK"]]]]];
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cur=ld("cur",0),done=ld("done",{}),theme=ld("theme","light"),big=ld("big",0);
function $(i){return document.getElementById(i)}
function first(t){var s=t.split(". ");return s[0]+(s.length>1?"…":"")}
function render(){
 document.documentElement.setAttribute("data-t",theme);
 document.documentElement.style.fontSize=(big?"118%":"100%");
 $("th").textContent=theme=="dark"?"☀️":"🌙";
 $("nav").innerHTML=P.map(function(p,i){return '<button class="'+(i==cur?'on':'')+'" data-p="'+i+'">'+p[0]+'</button>'}).join("");
 var h="";
 P[cur][1].forEach(function(sec,si){
  var n=sec[1].length,c=0;
  var rows=sec[1].map(function(k,ri){var id=cur+"-"+si+"-"+ri,d=done[id];if(d)c++;
   return '<div class="rk'+(d?' d':'')+'"><button class="chk" data-id="'+id+'" aria-label="İşaretle">'+(d?'✓':(ri+1))+'</button><button class="sr" data-k="'+k+'"><b>'+S[k][0]+'</b>'+(k=="F"?'<span>Yalnız Fâtiha</span>':'<span>'+first(S[k][1])+'</span>')+'</button></div>'}).join("");
  h+='<section class="sec"><h2>'+sec[0]+' <small>'+c+'/'+n+' rekât</small></h2>'+rows+'</section>';
 });
 h+='<button class="rst" id="rs">Bu namazın işaretlerini temizle</button>';
 $("app").innerHTML=h;
}
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;cur=+b.dataset.p;sv("cur",cur);render();scrollTo(0,0)};
$("app").onclick=function(e){
 var c=e.target.closest(".chk");if(c){var id=c.dataset.id;done[id]=!done[id];if(!done[id])delete done[id];sv("done",done);render();return}
 var s=e.target.closest(".sr");if(s){var k=s.dataset.k;$("pn").innerHTML='<h3>'+S[k][0]+'<button class="ib" id="cl">Kapat</button></h3>'+S[k][1].split(/(?<=[.!?])\s+/).map(function(a,i){return '<div class="ay"><i>'+(k=="F"&&i==0?'':'')+'</i>'+a+'</div>'}).join("");$("sh").classList.add("o");return}
 if(e.target.id=="rs"){Object.keys(done).forEach(function(k){if(k.indexOf(cur+"-")==0)delete done[k]});sv("done",done);render()}
};
$("sh").onclick=function(e){if(e.target.id=="sh"||e.target.id=="cl")$("sh").classList.remove("o")};
$("th").onclick=function(){theme=theme=="dark"?"light":"dark";sv("theme",theme);render()};
$("fz").onclick=function(){big=big?0:1;sv("big",big);render()};
render();
</script>
</body>
</html>
